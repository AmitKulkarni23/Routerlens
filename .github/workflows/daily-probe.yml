# Daily probe cron: runs once per day at 02:00 UTC (off-peak).
# MANUAL PREREQUISITE: Add OPENROUTER_API_KEY, SUPABASE_URL, and
# SUPABASE_SERVICE_ROLE_KEY as repository secrets in GitHub repo settings
# before this workflow can run successfully.

name: daily-probe

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:       # allow manual runs via the Actions tab

permissions:
  contents: read  # least privilege; no write access needed

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prober/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('prober/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build workspace
        working-directory: prober
        run: cargo build --workspace --release

      - name: Run probe
        working-directory: prober
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./target/release/probe --bank ../data/question_bank.json

      - name: Run detect_incidents
        working-directory: prober
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./target/release/detect_incidents

  ceiling-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prober/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('prober/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build workspace
        working-directory: prober
        run: cargo build --workspace --release

      - name: Run calibrate ceiling-check (report only, no --apply)
        working-directory: prober
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./target/release/calibrate --ceiling-check
