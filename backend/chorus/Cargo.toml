[package]
name = "chorus-lambda"
version = "0.1.0"
edition = "2021"

[lib]
name = "chorus_lambda"
path = "src/lib.rs"

[[bin]]
name = "chorus"
path = "src/main.rs"

[dependencies]
lambda_runtime = "0.13"
lambda_http = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
